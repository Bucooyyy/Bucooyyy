<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="title desc"><title id="title">MERN Authentication</title><desc id="desc">Authentication for a React web client. JWT access tokens + Redis revocation. Google / GitHub login via Passport. TOTP multi-factor authentication</desc><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.twinkle{animation:twinkle 5s steps(4) 1}.signal{animation:signal 4s steps(2) 1}@keyframes twinkle{50%{opacity:.35}}@keyframes signal{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.twinkle,.signal{animation:none}}</style><rect x="0" y="0" width="360" height="410" fill="#0B1020" /><path d="M12 2H348V10H358V400H348V408H12V400H2V10H12Z" fill="none" stroke="#34435F" stroke-width="2"/><rect x="14" y="14" width="332" height="30" fill="#151D33" /><text x="26" y="34" font-size="14" fill="#67E8F9" >PROJECT 01 / AUTH</text><text x="24" y="83" font-size="25" fill="#E6EDF7" font-weight="700">MERN</text><text x="24" y="115" font-size="25" fill="#E6EDF7" font-weight="700">Authentication</text><text x="24" y="153" font-size="13" fill="#AAB8D0" >Authentication for a React web client.</text><rect x="24" y="180" width="5" height="5" fill="#67E8F9" /><text x="38" y="189" font-size="14" fill="#E6EDF7" >JWT access tokens + Redis revocation</text><rect x="24" y="205" width="5" height="5" fill="#67E8F9" /><text x="38" y="214" font-size="14" fill="#E6EDF7" >Google / GitHub login via Passport</text><rect x="24" y="230" width="5" height="5" fill="#67E8F9" /><text x="38" y="239" font-size="14" fill="#E6EDF7" >TOTP multi-factor authentication</text><text x="24" y="276" font-size="14" fill="#AAB8D0" >Node.js · Express · MongoDB · Redis</text><text x="24" y="296" font-size="14" fill="#AAB8D0" >React · Passport.js</text><text x="24" y="384" font-size="13" fill="#67E8F9" >VIEW REPOSITORY  →</text></svg>
