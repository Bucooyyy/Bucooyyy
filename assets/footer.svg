<svg xmlns="http://www.w3.org/2000/svg" width="460" height="92" viewBox="0 0 460 92" role="img" aria-labelledby="title desc"><title id="title">Thanks for visiting</title><desc id="desc">Thanks for visiting</desc><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.twinkle{animation:twinkle 5s steps(4) 1}.signal{animation:signal 4s steps(2) 1}@keyframes twinkle{50%{opacity:.35}}@keyframes signal{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.twinkle,.signal{animation:none}}</style><rect x="0" y="0" width="460" height="92" fill="#0B1020" /><rect x="20" y="14" width="420" height="1" fill="#34435F" /><text x="230" y="47" font-size="20" fill="#67E8F9" text-anchor="middle" font-weight="700">THANKS FOR VISITING</text><text x="230" y="73" font-size="13" fill="#AAB8D0" text-anchor="middle">Let’s build something useful.</text><rect x="16" y="39" width="5" height="5" fill="#F9A8D4" class="twinkle"/><rect x="438" y="39" width="5" height="5" fill="#F9A8D4" class="twinkle"/></svg>
