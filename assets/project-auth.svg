<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-labelledby="title desc"><title id="title">MERN Authentication</title><desc id="desc">Authentication for a React web client. JWT access tokens + Redis revocation. Google / GitHub login via Passport. TOTP multi-factor authentication</desc><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.twinkle{animation:twinkle 5s steps(4) 1}.signal{animation:signal 4s steps(2) 1}@keyframes twinkle{50%{opacity:.35}}@keyframes signal{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.twinkle,.signal{animation:none}}</style><rect x="0" y="0" width="900" height="348" fill="#0B1020" /><path d="M12 2H888V10H898V338H888V346H12V338H2V10H12Z" fill="none" stroke="#34435F" stroke-width="2"/><rect x="14" y="14" width="872" height="30" fill="#151D33" /><text x="26" y="34" font-size="12" fill="#67E8F9" >PROJECT 01 / AUTH</text><text x="24" y="94" font-size="30" fill="#E6EDF7" font-weight="700">MERN Authentication</text><text x="24" y="132" font-size="16" fill="#AAB8D0" >Authentication for a React web client.</text><rect x="24" y="159" width="5" height="5" fill="#67E8F9" /><text x="38" y="168" font-size="17" fill="#E6EDF7" >JWT access tokens + Redis revocation</text><rect x="24" y="187" width="5" height="5" fill="#67E8F9" /><text x="38" y="196" font-size="17" fill="#E6EDF7" >Google / GitHub login via Passport</text><rect x="24" y="215" width="5" height="5" fill="#67E8F9" /><text x="38" y="224" font-size="17" fill="#E6EDF7" >TOTP multi-factor authentication</text><text x="24" y="264" font-size="14" fill="#AAB8D0" >Node.js · Express · MongoDB · Redis</text><text x="24" y="284" font-size="14" fill="#AAB8D0" >React · Passport.js</text><text x="24" y="326" font-size="13" fill="#67E8F9" >VIEW REPOSITORY  →</text></svg>
